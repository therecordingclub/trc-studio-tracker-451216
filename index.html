:root{
  --bg:#000000;--panel:#0d0d13;--panel-2:#101018;--elev:#15151f;--line:#242433;--line-soft:#1a1a25;
  --ink:#EEEEEE;--ink-dim:#9a9aad;--ink-faint:#6a6a7b;
  --accent:#6868ED;--accent-2:#8a8aff;--accent-ink:#c8c8ff;
  --gold:#D4A843;--gold-ink:#f0d38f;--gold-soft:rgba(212,168,67,.12);--gold-line:rgba(212,168,67,.30);
  --st-queued:#6B7280;--st-mixing:#E6B450;--st-review:#38BDF8;--st-revisions:#F0873E;--st-approved:#34D399;
  --danger:#F03222;--radius:12px;--shadow:0 1px 0 rgba(255,255,255,.03) inset;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1100px 560px at 84% -10%,rgba(104,104,237,.09),transparent 60%),radial-gradient(820px 460px at 6% -6%,rgba(212,168,67,.05),transparent 55%),var(--bg);
  color:var(--ink);font-family:'Karla',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh}
h1,h2,h3,h4{font-family:'Geologica',system-ui,sans-serif;margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent-2);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* top nav */
.topnav{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;padding:12px 22px;background:rgba(7,7,11,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:'Geologica';font-weight:700;font-size:15px;white-space:nowrap}
.brandmark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#7676ff,#5a5aea);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800}
.navtabs{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.navtab{border:1px solid transparent;background:transparent;color:var(--ink-dim);padding:8px 13px;border-radius:9px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:8px;transition:.14s}
.navtab:hover{color:var(--ink);background:var(--panel-2)}
.navtab[aria-current="true"]{background:var(--ink);color:#0a0a10}
.navtab svg{width:15px;height:15px}
.nav-div{width:1px;height:22px;background:var(--line);margin:0 4px}
.navtab.client[aria-current="true"]{background:linear-gradient(180deg,#7676ff,#5a5aea);color:#fff}
.rolechip{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:5px 11px;display:inline-flex;gap:7px;align-items:center}
.rolechip .d{width:7px;height:7px;border-radius:50%;background:var(--st-approved)}

.wrap{max-width:1160px;margin:0 auto;padding:26px 22px 100px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--elev);color:var(--ink);padding:9px 14px;border-radius:9px;font-weight:700;font-size:13.5px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#33334a;background:#1a1a26}
.btn.primary{background:linear-gradient(180deg,#7676ff,#5a5aea);border-color:#6f6ff5;color:#fff;box-shadow:0 6px 20px -10px rgba(104,104,237,.9)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.gold{background:linear-gradient(180deg,#e3bb59,#cc9f3b);border-color:#d8ad45;color:#231a05}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn svg{width:16px;height:16px;stroke-width:2.1}
.btn.sm svg{width:14px;height:14px}

/* header */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{display:flex;align-items:center;gap:9px;color:var(--ink-faint);font-size:11.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;margin-bottom:10px}
.eyebrow .dot{width:4px;height:4px;border-radius:50%;background:var(--ink-faint)}
.eyebrow .cur{color:var(--gold-ink)}
h1.title{font-size:29px;font-weight:800}
.subtitle{color:var(--ink-dim);margin-top:7px;font-size:14.5px;max-width:60ch}
.head-actions{display:flex;gap:10px;align-items:center}

/* stat band */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;margin-bottom:26px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow)}
.stat .l{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);display:flex;align-items:center;gap:7px}
.stat .l .d{width:8px;height:8px;border-radius:50%}
.stat .v{font-family:'Geologica';font-weight:700;font-size:27px;margin-top:9px;letter-spacing:-.02em}
.stat .s{font-size:11.5px;color:var(--ink-dim);margin-top:2px}
.stat.gold{background:linear-gradient(180deg,rgba(212,168,67,.09),rgba(212,168,67,.02));border-color:var(--gold-line)}
.stat.gold .v{color:var(--gold-ink)}
.stat.gold .l{color:#c9a961}

/* toolbar / filters */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.tleft{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.h-sec{font-family:'Geologica';font-weight:700;font-size:16px}
.count-badge{font-size:12px;color:var(--ink-faint);font-weight:700;background:var(--elev);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 11px;min-width:210px}
.search svg{width:15px;height:15px;color:var(--ink-faint);flex:none}
.search input{background:none;border:0;outline:none;color:var(--ink);font-size:13.5px;width:100%;font-family:inherit}
.search input::placeholder{color:var(--ink-faint)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fpill{border:1px solid var(--line);background:transparent;color:var(--ink-dim);padding:6px 11px;border-radius:999px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:6px;transition:.14s}
.fpill:hover{border-color:#3a3a52;color:var(--ink)}
.fpill[aria-pressed="true"]{background:var(--ink);color:#0a0a10;border-color:var(--ink)}
.fpill .n{opacity:.55;font-variant-numeric:tabular-nums}
.fpill .d{width:7px;height:7px;border-radius:50%}

/* project rows */
.projects{display:flex;flex-direction:column;gap:9px}
.prow{display:flex;align-items:center;gap:15px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:.14s;text-align:left;width:100%}
.prow:hover{border-color:#3a3a55;background:var(--panel-2)}
.prow:hover .chev{transform:translateX(3px);color:var(--ink)}
.avatar{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-family:'Geologica';font-weight:700;font-size:14px;color:#0a0a10;flex:none}
.prow .pmain{flex:1;min-width:0}
.pnamerow{display:flex;align-items:center;gap:9px;min-width:0}
.prow .pname{font-family:'Geologica';font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kind-chip{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-dim);background:var(--elev);border:1px solid var(--line);border-radius:6px;padding:2px 7px;white-space:nowrap;flex:none}
.prow .pclient{font-size:12.5px;color:var(--ink-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.metric{display:flex;flex-direction:column;align-items:flex-end;min-width:56px}
.metric .mv{font-family:'Geologica';font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.metric .mv.g{color:var(--gold-ink)}
.metric .ml{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-faint);margin-top:1px}
.chev{color:var(--ink-faint);transition:.15s;flex:none}
.chev svg{width:20px;height:20px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;text-transform:capitalize}
.pill .d{width:7px;height:7px;border-radius:50%}

/* back bar */
.backbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--elev);color:var(--ink-dim);padding:8px 13px;border-radius:9px;font-weight:700;font-size:13px}
.back:hover{color:var(--ink);border-color:#33334a}
.back svg{width:15px;height:15px}
.backbar .bc{color:var(--ink-faint);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
.backbar .bc b{color:var(--ink-dim)}
.backbar .dot{width:4px;height:4px;border-radius:50%;background:var(--ink-faint);display:inline-block;margin:0 4px}

/* project header */
.phead{padding:18px 20px;margin-bottom:16px}
.phead-top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ptitle-wrap{display:flex;gap:14px;align-items:center;min-width:0}
.ptitle{font-size:23px;font-weight:800;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.psub{color:var(--ink-dim);font-size:13.5px;margin-top:4px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.psub .who{display:inline-flex;align-items:center;gap:6px}
.mini-av{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-family:'Geologica';font-weight:700;font-size:9.5px;color:#0a0a10}
.phead-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.status-select{position:relative}
.status-select select{appearance:none;-webkit-appearance:none;background:var(--elev);border:1px solid var(--line);color:var(--ink);font-family:inherit;font-weight:700;font-size:13px;padding:9px 30px 9px 30px;border-radius:9px;cursor:pointer}
.status-select .sdot{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:8px;height:8px;border-radius:50%;pointer-events:none}
.status-select .chevs{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-faint)}
.status-select .chevs svg{width:14px;height:14px}
.phead-foot{display:flex;align-items:center;gap:26px;flex-wrap:wrap;margin-top:16px;padding-top:15px;border-top:1px solid var(--line-soft)}
.pstat .l{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}
.pstat .v{font-family:'Geologica';font-weight:700;font-size:19px;margin-top:5px;letter-spacing:-.01em}
.pstat .v.g{color:var(--gold-ink)}
.folder-chip{display:inline-flex;align-items:center;gap:8px;background:rgba(0,97,255,.12);border:1px solid rgba(0,97,255,.33);color:#7fb0ff;border-radius:10px;padding:10px 15px;font-size:14px;font-weight:700;margin-left:auto}
.folder-chip svg{width:17px;height:17px;flex:none}

.cols{display:grid;grid-template-columns:minmax(0,0.9fr) minmax(0,1.1fr);gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
.card-h h3{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-dim);display:flex;align-items:center;gap:8px}
.card-h h3 svg{width:15px;height:15px;color:var(--ink-faint)}
.card-b{padding:15px 16px}

/* time log */
.total-band{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(180deg,rgba(212,168,67,.10),rgba(212,168,67,.02));border:1px solid var(--gold-line);border-radius:11px;padding:14px 16px;margin-bottom:13px}
.total-band .tl{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#c9a961}
.total-band .tv{font-family:'Geologica';font-weight:800;font-size:36px;color:var(--gold-ink);letter-spacing:-.02em;line-height:1}
.total-band .tv.bump{animation:bump .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.13);color:#fff}100%{transform:scale(1)}}
.total-band .tside{text-align:right}
.total-band .tside .s{font-size:11.5px;color:var(--ink-dim)}
.timer{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:13px}
.timer .clock{font-family:'Geologica';font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer .rec{width:9px;height:9px;border-radius:50%;background:var(--st-revisions)}
.timer.on .rec{background:var(--danger);animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(240,50,34,.5)}50%{opacity:.55;box-shadow:0 0 0 6px rgba(240,50,34,0)}}
.timer .tstate{font-size:12px;color:var(--ink-dim);flex:1}
.entries{display:flex;flex-direction:column;gap:2px}
.entry{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:9px 8px;border-radius:8px}
.entry:hover{background:var(--panel-2)}
.entry .edate{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:52px}
.entry .enote{font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .enote .eng{color:var(--ink-faint);font-size:11.5px;margin-left:7px}
.entry .ehours{font-family:'Geologica';font-weight:700;font-size:13.5px;color:var(--gold-ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.entry .edel{opacity:0;border:0;background:none;color:var(--ink-faint);padding:2px 4px;border-radius:6px}
.entry:hover .edel{opacity:1}
.entry .edel:hover{color:var(--danger);background:rgba(240,50,34,.1)}
.addform{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint)}
.inp{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:13.5px;outline:none}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--ink-faint)}

/* versions */
.versions{display:flex;flex-direction:column;gap:11px}
.track{border:1px solid var(--line);border-radius:14px;background:var(--panel-2);overflow:hidden}
.track-top{display:flex;align-items:center;gap:14px;padding:16px 18px}
.vbadge{font-family:'Geologica';font-weight:700;font-size:14px;padding:5px 12px;border-radius:9px;background:var(--elev);border:1px solid var(--line);white-space:nowrap}
.vbadge.final{background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.4);color:#8ff0c9}
.track .vmeta{min-width:0;flex:1}
.track .vname{font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .vdate{font-size:12.5px;color:var(--ink-faint);margin-top:3px}
.dropbox-chip{display:inline-flex;align-items:center;gap:7px;background:rgba(0,97,255,.12);border:1px solid rgba(0,97,255,.35);color:#7fb0ff;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:700;max-width:220px}
.dropbox-chip svg{width:16px;height:16px;flex:none}
.dropbox-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filetag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
/* audio player */
.player{display:flex;align-items:center;gap:15px;padding:6px 18px 18px}
.play-btn{width:52px;height:52px;border-radius:50%;border:1px solid var(--accent);background:rgba(104,104,237,.16);color:#fff;display:grid;place-items:center;flex:none;transition:.15s}
.play-btn:hover{background:var(--accent)}
.play-btn svg{width:21px;height:21px}
.wave{flex:1;display:flex;align-items:center;gap:3px;height:58px;cursor:pointer;min-width:0}
.wave i{flex:1;background:#2b2b3d;border-radius:2px;min-height:3px;transition:background .1s}
.wave i.on{background:var(--accent)}
.wave i.head{background:#fff}
.ptime{font-size:13px;color:var(--ink-dim);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:88px;text-align:right}
/* video player */
.vwrap{padding:4px 16px 16px}
.vplayer{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#06060b;cursor:pointer;border:1px solid var(--line)}
.vposter{position:absolute;inset:0;background:linear-gradient(135deg,rgba(104,104,237,.30),rgba(8,8,16,.4) 45%,rgba(212,168,67,.20)),repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 2px,transparent 2px 5px)}
.vposter .film{position:absolute;right:14px;top:12px;color:rgba(255,255,255,.28)}
.vposter .film svg{width:22px;height:22px}
.vposter .vlabel{position:absolute;left:14px;top:12px;font-family:'Geologica';font-weight:700;font-size:12.5px;color:rgba(255,255,255,.7);letter-spacing:.02em}
.vplay-overlay{position:absolute;inset:0;display:grid;place-items:center}
.vplay-overlay .play-btn{width:64px;height:64px;background:rgba(10,10,18,.55);backdrop-filter:blur(3px)}
.vplay-overlay .play-btn svg{width:26px;height:26px}
.vbar{position:absolute;left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.14)}
.vbar-fill{height:100%;width:0;background:var(--accent)}
.vtime{position:absolute;right:10px;bottom:13px;font-size:12px;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:6px;color:#fff;font-variant-numeric:tabular-nums}
.track-foot{border-top:1px solid var(--line-soft);padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sent-state{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700}
.sent-state .d{width:7px;height:7px;border-radius:50%}
.track-actions{display:flex;gap:7px;flex-wrap:wrap}
.feedback{border-top:1px solid var(--line-soft);background:rgba(104,104,237,.05);padding:11px 13px;display:flex;flex-direction:column;gap:9px}
.fb{display:flex;gap:9px}
.fb .fav{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-family:'Geologica';font-weight:700;font-size:10px;color:#0a0a10;flex:none}
.fb .fbody{background:var(--panel);border:1px solid var(--line);border-radius:9px;border-top-left-radius:2px;padding:8px 11px;flex:1}
.fb .fwho{font-size:11.5px;font-weight:700;color:var(--accent-ink)}
.fb .fwho .fd{color:var(--ink-faint);font-weight:600;margin-left:7px}
.fb .ftext{font-size:13.5px;margin-top:3px;line-height:1.45;color:#dcdce6}
.empty{padding:26px 16px;text-align:center;color:var(--ink-faint);font-size:13.5px}
.empty svg{width:26px;height:26px;margin-bottom:8px;opacity:.6}

/* files / intake */
.files{display:flex;flex-direction:column;gap:8px}
.filerow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.fileicon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--elev);border:1px solid var(--line);color:var(--ink-dim)}
.fileicon svg{width:16px;height:16px}
.filerow .fmain{flex:1;min-width:0}
.filerow .fn{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filerow .fmeta{font-size:11.5px;color:var(--ink-faint);margin-top:1px}
.src-chip{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.src-client{background:rgba(104,104,237,.15);color:var(--accent-2)}
.src-studio{background:rgba(212,168,67,.14);color:var(--gold-ink)}

/* overview: hubs */
.hubs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.hub{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;opacity:.55}
.hub .hi{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--elev);border:1px solid var(--line);color:var(--ink-dim);margin-bottom:11px}
.hub .hi svg{width:17px;height:17px}
.hub .hn{font-family:'Geologica';font-weight:700;font-size:15px}
.hub .hs{font-size:12px;color:var(--ink-faint);margin-top:3px}
.hub.studio{opacity:1;grid-column:span 3;background:linear-gradient(180deg,rgba(104,104,237,.08),transparent);border-color:rgba(104,104,237,.32)}
.hub.studio .hn{font-size:16px}
.studio-tools{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-top:14px}
.tool{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);border-radius:11px;background:var(--panel-2);cursor:pointer;transition:.15s;text-align:left;width:100%}
.tool:hover{border-color:var(--accent);background:#141422}
.tool .ti{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff}
.tool .ti svg{width:21px;height:21px}
.tool .tmain{flex:1;min-width:0}
.tool .tn{font-family:'Geologica';font-weight:700;font-size:16px}
.tool .ts{font-size:12px;color:var(--ink-dim);margin-top:2px}
.tool .chev{margin-left:auto}
.hub-note{font-size:12px;color:var(--ink-faint);margin-top:12px;display:flex;gap:7px;align-items:center}
.hub-note svg{width:14px;height:14px;flex:none}

/* progress panel */
.prog{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
.checklist{display:flex;flex-direction:column;gap:3px}
.ci{display:flex;align-items:flex-start;gap:11px;padding:11px 8px;border-radius:9px}
.ci:hover{background:var(--panel-2)}
.ci .cdot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:1px}
.ci .cdot svg{width:13px;height:13px}
.ci.done .cdot{background:rgba(52,211,153,.16);color:var(--st-approved);border:1px solid rgba(52,211,153,.4)}
.ci.next .cdot{background:var(--elev);color:var(--ink-faint);border:1px dashed var(--line)}
.ci .ctxt .ct{font-weight:700;font-size:14px}
.ci.done .ct{color:var(--ink)}
.ci.next .ct{color:var(--ink-dim)}
.ci .cs{font-size:12px;color:var(--ink-faint);margin-top:2px}
.mini-stats{display:flex;flex-direction:column;gap:10px}
.ms{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:11px;background:var(--panel-2)}
.ms .ml2{font-size:12px;color:var(--ink-dim);font-weight:600}
.ms .mv2{font-family:'Geologica';font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.ms .mv2.g{color:var(--gold-ink)}

/* client portal */
.client-banner{display:flex;align-items:center;gap:11px;background:linear-gradient(180deg,rgba(104,104,237,.12),rgba(104,104,237,.03));border:1px solid rgba(104,104,237,.3);border-radius:12px;padding:12px 16px;margin-bottom:20px;font-size:13px;color:var(--accent-ink)}
.client-banner svg{width:17px;height:17px;flex:none}
.client-banner b{color:#fff}
.welcome{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.welcome .wav{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;font-family:'Geologica';font-weight:700;font-size:17px;color:#0a0a10;flex:none}
.welcome h1{font-size:25px;font-weight:800}
.welcome .ws{color:var(--ink-dim);font-size:14px;margin-top:3px}
.dropzone{border:1.5px dashed rgba(104,104,237,.45);border-radius:14px;background:rgba(104,104,237,.05);padding:22px;text-align:center;margin-bottom:24px}
.dropzone .dz-ico{width:48px;height:48px;border-radius:13px;background:rgba(104,104,237,.16);display:grid;place-items:center;margin:0 auto 12px;color:var(--accent-2)}
.dropzone .dz-ico svg{width:23px;height:23px}
.dropzone h3{font-size:17px;font-weight:800}
.dropzone p{color:var(--ink-dim);font-size:13px;margin:5px 0 15px}
.dz-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dz-chip{border:1px solid var(--line);background:var(--elev);color:var(--ink);border-radius:9px;padding:9px 14px;font-weight:700;font-size:13px;display:inline-flex;gap:8px;align-items:center;transition:.14s}
.dz-chip:hover{border-color:var(--accent);background:#161626}
.dz-chip svg{width:15px;height:15px;color:var(--accent-2)}

const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(s){if(!s)return"";const[y,m,d]=s.split("-").map(Number);return`${MON[m-1]} ${d}`;}
function todayISO(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function projectHours(p){let h=p.time.reduce((a,t)=>a+(+t.hours||0),0);if(state.timer.running&&state.timer.projectId===p.id)h+=liveTimerMs()/3600000;return h;}
function fmtHours(h){const r=Math.round(h*100)/100;return(r%1===0?r.toFixed(0):(Math.round(r*100)%10===0?r.toFixed(1):r.toFixed(2)));}
function fmtHrsShort(h){const r=Math.round(h*10)/10;return(r%1===0?r.toFixed(0):r.toFixed(1));}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function clockFmt(ms){const s=Math.floor(ms/1000);return`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;}
function projById(id){return projects.find(p=>p.id===id);}
function byMedium(m){return projects.filter(p=>p.medium===m);}
function lastActivity(p){const ds=[...p.time.map(t=>t.date),...p.versions.map(v=>v.date)].filter(Boolean).sort();return ds.length?ds[ds.length-1]:p.started;}
function waveBars(seed,n=42){let x=0;for(const c of seed)x=(x*131+c.charCodeAt(0))>>>0;const out=[];for(let i=0;i<n;i++){x=(x*1103515245+12345)>>>0;const base=0.35+((x>>7)%100)/100*0.65;const env=Math.sin((i/n)*Math.PI);out.push(Math.max(0.16,base*(0.55+0.6*env)));}return out;}
function pill(status){const s=STATUS[status];return`<span class="pill" style="background:${s.color}1f;color:${s.color}"><span class="d" style="background:${s.color}"></span>${s.label}</span>`;}
function progressPct(status){return{queued:8,mixing:40,editing:40,review:65,revisions:80,approved:100}[status]||0;}

function fileRow(f){

function renderVersion(p,v,medium){
  const isFinal=/final/i.test(v.name)||v.approved;
  const sent=v.approved?`<span class="sent-state" style="color:var(--st-approved)"><span class="d" style="background:var(--st-approved)"></span>Approved by ${esc(p.client.split(" ")[0])}</span>`
    :v.feedback.length?`<span class="sent-state" style="color:var(--st-revisions)"><span class="d" style="background:var(--st-revisions)"></span>Notes received</span>`
    :v.sent?`<span class="sent-state" style="color:var(--st-review)"><span class="d" style="background:var(--st-review)"></span>Sent · awaiting notes</span>`
    :`<span class="sent-state" style="color:var(--ink-faint)"><span class="d" style="background:var(--ink-faint)"></span>Not sent</span>`;
  const top=`<div class="track-top"><span class="vbadge ${isFinal?"final":""}">${esc(v.v)}</span><div class="vmeta"><div class="vname">${esc(v.name)} <span class="filetag">${MEDIA[medium].ext}</span></div><div class="vdate">Uploaded ${fmtDate(v.date)}</div></div><a class="dropbox-chip" href="${esc(v.dropbox)}" target="_blank" rel="noopener" title="${esc(v.dropbox)}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2 0 6l6 4 6-4-6-4Zm12 0-6 4 6 4 6-4-6-4ZM0 14l6 4 6-4-6-4-6 4Zm18-4-6 4 6 4 6-4-6-4ZM6 19l6 4 6-4-6-4-6 4Z"/></svg><span>Dropbox link</span></a></div>`;
  const foot=`<div class="track-foot">${sent}<div class="track-actions"><button class="btn sm ghost" data-action="copy-link" data-vid="${v.id}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>Copy link</button>${!v.approved?`<button class="btn sm ${v.sent?"":"primary"}" data-action="send" data-vid="${v.id}">${IC.send}${v.sent?"Resend":"Send to client"}</button>`:""}</div></div>`;

  return`<div class="track" data-vid="${v.id}">${top}${mediaPlayer(v,medium)}${foot}${fb}</div>`;

function mediaPlayer(v,medium){
  if(medium==="video"){
    return`<div class="vwrap"><div class="vplayer" data-vid="${v.id}" data-len="${v.len}" data-pos="0"><div class="vposter"><span class="vlabel">${esc(v.v)} · ${esc(v.name)}</span><span class="film">${IC.film}</span></div><div class="vplay-overlay"><button class="play-btn" data-action="play" data-vid="${v.id}"><svg viewBox="0 0 24 24" fill="currentColor" class="i-play"><path d="M8 5v14l11-7z"/></svg><svg viewBox="0 0 24 24" fill="currentColor" class="i-pause" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button></div><span class="ptime vtime" data-vid="${v.id}">0:00 / ${clockFmt(v.len*1000)}</span><div class="vbar"><div class="vbar-fill" data-vid="${v.id}"></div></div></div></div>`;
  }
  const bars=waveBars(v.id);
  return`<div class="player"><button class="play-btn" data-action="play" data-vid="${v.id}"><svg viewBox="0 0 24 24" fill="currentColor" class="i-play"><path d="M8 5v14l11-7z"/></svg><svg viewBox="0 0 24 24" fill="currentColor" class="i-pause" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button><div class="wave" data-vid="${v.id}" data-len="${v.len}" data-pos="0">${bars.map((h,i)=>`<i style="height:${Math.round(h*50)}px" data-i="${i}"></i>`).join("")}</div><span class="ptime" data-vid="${v.id}">0:00 / ${clockFmt(v.len*1000)}</span></div>`;
}

/* ============ MEDIA PLAYBACK ============ */
const players={};
function clearPlayers(){for(const k in players){clearInterval(players[k]);delete players[k];}}
function getClip(vid){return document.querySelector(`.wave[data-vid="${vid}"], .vplayer[data-vid="${vid}"]`);}
function bindMedia(){
  document.querySelectorAll(".wave").forEach(w=>w.addEventListener("click",e=>{const bar=e.target.closest("i");if(!bar)return;const n=w.querySelectorAll("i").length;seekTo(w.dataset.vid,(+bar.dataset.i/n)*+w.dataset.len);}));
  document.querySelectorAll(".vplayer").forEach(v=>v.addEventListener("click",e=>{if(e.target.closest(".play-btn"))return;const r=v.getBoundingClientRect();seekTo(v.dataset.vid,((e.clientX-r.left)/r.width)*+v.dataset.len);}));
}
function paint(vid){
  const c=getClip(vid);if(!c)return;const len=+c.dataset.len,pos=+c.dataset.pos||0;
  const pt=document.querySelector(`.ptime[data-vid="${vid}"]`);if(pt)pt.textContent=`${clockFmt(pos*1000)} / ${clockFmt(len*1000)}`;
  if(c.classList.contains("wave")){const bars=c.querySelectorAll("i"),n=bars.length,head=Math.floor(pos/len*n);bars.forEach((b,i)=>b.className=i<head?"on":(i===head?"head":""));}
  else{const f=document.querySelector(`.vbar-fill[data-vid="${vid}"]`);if(f)f.style.width=(pos/len*100)+"%";}
}
function seekTo(vid,sec){const c=getClip(vid);if(!c)return;c.dataset.pos=Math.max(0,Math.min(+c.dataset.len,sec));paint(vid);}
function togglePlay(vid){
  const c=getClip(vid);if(!c)return;const len=+c.dataset.len;
  const pb=document.querySelector(`.play-btn[data-vid="${vid}"]`),ip=pb.querySelector(".i-play"),ipa=pb.querySelector(".i-pause");
  if(players[vid]){clearInterval(players[vid]);delete players[vid];ip.style.display="";ipa.style.display="none";return;}
  for(const k in players){clearInterval(players[k]);delete players[k];const o=document.querySelector(`.play-btn[data-vid="${k}"]`);if(o){o.querySelector(".i-play").style.display="";o.querySelector(".i-pause").style.display="none";}}
  ip.style.display="none";ipa.style.display="";if((+c.dataset.pos||0)>=len)c.dataset.pos=0;
  const spd=c.classList.contains("vplayer")?1.4:0.25;
  players[vid]=setInterval(()=>{let pos=(+c.dataset.pos||0)+spd;if(pos>=len){pos=len;clearInterval(players[vid]);delete players[vid];ip.style.display="";ipa.style.display="none";}c.dataset.pos=pos;paint(vid);},120);
}

/* ============ TIMER ============ */
function liveTimerMs(){return state.timer.baseMs+(state.timer.running?(Date.now()-state.timer.startMs):0);}
let timerTick=null;
function toggleTimer(){
  const p=projById(state.selectedId),medium=p.medium;
  if(state.timer.running&&state.timer.projectId===p.id){
    const hours=Math.max(0.25,Math.round((liveTimerMs()/3600000)/0.25)*0.25);
    p.time.push({id:uid("t"),date:todayISO(),hours,note:"Live session",who:p.person});
    clearInterval(timerTick);timerTick=null;state.timer={running:false,projectId:null,startMs:0,baseMs:0};
    renderProject(medium);toast(`Session logged: ${fmtHours(hours)}h · total now ${fmtHrsShort(projectHours(p))}h`,"gold");
  }else{
    state.timer={running:true,projectId:p.id,startMs:Date.now(),baseMs:0};renderProject(medium);
    clearInterval(timerTick);timerTick=setInterval(()=>{const c=$("#timerClock");if(c)c.textContent=clockFmt(liveTimerMs());else{clearInterval(timerTick);timerTick=null;}},250);
  }
}

/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-action],[data-nav],[data-nav-tool]");if(!t)return;
  if(t.dataset.nav){state.section=t.dataset.nav;state.selectedId=null;state.clientId=null;state.filter="all";state.search="";render();window.scrollTo(0,0);return;}
  if(t.dataset.navTool){state.section=t.dataset.navTool==="mix"?"mix":"video";state.selectedId=null;state.filter="all";state.search="";render();window.scrollTo(0,0);return;}
  const a=t.dataset.action;
  if(a==="open-project"){state.selectedId=t.dataset.id;render();window.scrollTo(0,0);}
  else if(a==="go-list"){state.selectedId=null;render();window.scrollTo(0,0);}
  else if(a==="set-filter"){state.filter=t.dataset.filter;renderFilters(t.dataset.medium);renderProjects(t.dataset.medium);}
  else if(a==="toggle-timer")toggleTimer();
  else if(a==="del-time"){const p=projById(state.selectedId);p.time=p.time.filter(x=>x.id!==t.dataset.id);renderProject(p.medium);toast("Entry removed");}
  else if(a==="play")togglePlay(t.dataset.vid);
  else if(a==="mark-done")markDone();
  else if(a==="copy-link")copyLink(t.dataset.vid);
  else if(a==="send")openSend(t.dataset.vid);
  else if(a==="add-file")addFile(t.dataset.kind);
  else if(a==="new-project")openNewProject(t.dataset.medium);
  else if(a==="legend")openLegend(t.dataset.medium);
  else if(a==="open-client")openClient(t.dataset.id);
  else if(a==="client-home"){state.clientId=null;render();window.scrollTo(0,0);}
  else if(a==="client-send")clientSend(t.dataset.kind);
  else if(a==="close-modal")closeModal();
});
document.addEventListener("submit",e=>{
  const t=e.target.closest("[data-action]");if(!t)return;e.preventDefault();const a=t.dataset.action,fd=new FormData(t);
  if(a==="add-time"){const p=projById(state.selectedId);const hours=parseFloat(fd.get("hours"));if(!(hours>0))return;p.time.push({id:uid("t"),date:fd.get("date")||todayISO(),hours,note:(fd.get("note")||"").trim()||"Session",who:p.person});if(p.status==="queued")p.status=p.medium==="audio"?"mixing":"editing";renderProject(p.medium);const tv=$("#totalVal");if(tv){tv.classList.remove("bump");void tv.offsetWidth;tv.classList.add("bump");}toast(`Time added · total now ${fmtHrsShort(projectHours(p))}h`,"gold");}
  else if(a==="add-version"){const p=projById(state.selectedId);p.versions.push({id:uid("v"),v:(fd.get("v")||"").trim(),name:(fd.get("name")||"").trim(),date:todayISO(),len:190+Math.floor(projectHours(p)*3)%80,dropbox:(fd.get("dropbox")||"").trim(),sent:false,feedback:[]});renderProject(p.medium);toast(`${p.medium==="audio"?"Mix":"Cut"} version added`,"blue");}
  else if(a==="submit-note")submitNote(fd.get("vid"),fd.get("text"));
  else if(a==="create-project")createProject(fd);
  else if(a==="client-note")submitClientNote(fd.get("vid"),fd.get("text"));
});
document.addEventListener("change",e=>{const t=e.target.closest("[data-action]");if(!t)return;if(t.dataset.action==="set-status"){const p=projById(state.selectedId);p.status=e.target.value;renderProject(p.medium);toast(`Status → ${STATUS[e.target.value].label}`,"blue");}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

function markDone(){const p=projById(state.selectedId);p.status="approved";const last=[...p.versions].reverse().find(v=>v.sent)||p.versions[p.versions.length-1];if(last)last.approved=true;renderProject(p.medium);toast(`${p.title} marked done · ${fmtHrsShort(projectHours(p))}h logged`,"gold");}
function copyLink(vid){const p=projById(state.selectedId);navigator.clipboard&&navigator.clipboard.writeText(`https://app.therecording.club/project/${p.id}-${vid}`).catch(()=>{});toast("Shareable client link copied","blue");}
function addFile(kind){const p=projById(state.selectedId);const from=kind==="Recorded here"?"studio":"client";const ext=p.medium==="audio"?(kind==="Stems"?"zip":"wav"):"mp4";p.intake.push({id:uid("f"),name:`${p.title.replace(/\s+/g,"_")}_${kind.replace(/\s+/g,"").toLowerCase()}.${ext}`,from,kind,date:todayISO()});renderProject(p.medium);toast("File added to project","blue");}

/* ============ CLIENT PORTAL ============ */
function renderClientHome(){
  clearPlayers();
  const mine=projects.filter(p=>p.client===CLIENT_NAME);
  $("#app").innerHTML=`
    <div class="client-banner">${IC.users}<span><b>Client view.</b> This is what a member sees when they log in. They send you files, review versions, leave notes, and follow progress.</span></div>
    <div class="welcome"><span class="wav" style="background:${avColor(CLIENT_NAME)}">${initials(CLIENT_NAME)}</span><div><h1>Hi ${esc(CLIENT_NAME.split(" ")[0])}</h1><div class="ws">Your projects with The Recording Club</div></div></div>
    <div class="dropzone"><div class="dz-ico">${IC.upload}</div><h3>Send us your files</h3><p>Drop stems, mixes, footage, or reference tracks. They go straight to your project folder in Dropbox.</p>
      <div class="dz-chips"><button class="dz-chip" data-action="client-send" data-kind="Stems">${IC.music}Stems</button><button class="dz-chip" data-action="client-send" data-kind="Mix">${IC.sliders}Mix</button><button class="dz-chip" data-action="client-send" data-kind="Footage">${IC.film}Footage</button><button class="dz-chip" data-action="client-send" data-kind="Reference">${IC.file}Reference</button></div>
    </div>
    <h2 class="section-h">Your projects</h2>
    <div class="projects">${mine.map(p=>{const M=MEDIA[p.medium];return`<button class="cproj" data-action="open-client" data-id="${p.id}">
      <span class="mediaicon" style="background:${M.accent}">${p.medium==="audio"?IC.sliders:IC.film}</span>
      <span class="cmain"><span class="cn">${esc(p.title)}</span><span class="cmeta">${esc(p.kind)} · ${M.tool} · ${p.versions.length} ${M.fileNoun}${p.versions.length===1?"":"s"} shared</span></span>
      <span class="cbarwrap"><span class="cbar"><span class="cbar-fill" style="width:${progressPct(p.status)}%;background:${STATUS[p.status].color}"></span></span><span class="cbar-l" style="color:${STATUS[p.status].color}">${STATUS[p.status].label}</span></span>
      <span class="chev">${IC.chev}</span></button>`;}).join("")}</div>
    <div class="foot-note"><b>Client facing.</b> Simplified on purpose, no time logs or internal status. Members only see their own projects, the versions you share, and where things stand.</div>`;
}
function openClient(id){state.clientId=id;render();window.scrollTo(0,0);}
function renderClientProject(){
  clearPlayers();
  const p=projById(state.clientId);if(!p){state.clientId=null;return render();}
  const M=MEDIA[p.medium];
  const shared=p.versions.filter(v=>v.sent);
  const steps=M.steps;const curIdx=steps.findIndex(([k])=>k===p.status);
  $("#app").innerHTML=`
    <div class="client-banner">${IC.users}<span><b>Client view.</b> ${esc(CLIENT_NAME.split(" ")[0])}'s view of this project.</span></div>
    <div class="backbar"><button class="back" data-action="client-home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>Your projects</button></div>
    <div class="panel phead">
      <div class="phead-top"><div class="ptitle-wrap"><span class="mediaicon" style="width:46px;height:46px;background:${M.accent}">${p.medium==="audio"?IC.sliders:IC.film}</span><div><div class="ptitle">${esc(p.title)}<span class="kind-chip">${esc(p.kind)}</span></div><div class="psub"><span>${M.tool} with The Recording Club</span></div></div></div>${pill(p.status)}</div>
      <div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft)"><div class="timeline">${steps.map(([k,l],i)=>`<div class="tstep ${i<curIdx?"done":(i===curIdx?"cur":"")}"><div class="tline"></div><div class="tnode">${i<curIdx?IC.check:(i===curIdx?`<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/></svg>`:"")}</div><div class="tlab">${l}</div></div>`).join("")}</div></div>
    </div>
    <div class="cols">
      <div class="card">
        <div class="card-h"><h3>${p.medium==="audio"?IC.music:IC.film}${p.medium==="audio"?"Your mixes":"Your cuts"}</h3></div>
        <div class="card-b"><div class="versions">${shared.length?shared.map(v=>clientVersion(p,v)).join(""):`<div class="empty">Nothing shared yet. We'll post ${M.fileNoun}s here as they're ready.</div>`}</div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card"><div class="card-h"><h3>${IC.upload}Send us files</h3></div><div class="card-b"><p style="font-size:13px;color:var(--ink-dim);margin:0 0 12px">Add stems, mixes, footage, or references for this project.</p><div class="dz-chips" style="justify-content:flex-start">${(p.medium==="audio"?[["Stems",IC.music],["Mix",IC.sliders],["Reference",IC.file]]:[["Footage",IC.film],["Reference",IC.file]]).map(([k,ic])=>`<button class="dz-chip" data-action="client-send" data-kind="${k}">${ic}${k}</button>`).join("")}</div></div></div>
        <div class="card"><div class="card-h"><h3>${IC.file}Files you've sent</h3></div><div class="card-b"><div class="files">${p.intake.filter(f=>f.from==="client").length?p.intake.filter(f=>f.from==="client").map(f=>fileRow(f)).join(""):`<div class="empty" style="padding:14px">Nothing sent yet.</div>`}</div></div></div>
      </div>
    </div>`;
  bindMedia();
}
function clientVersion(p,v){
  const bars=waveBars(v.id);
  const player=mediaPlayer(v,p.medium);
  const fb=v.feedback.length?`<div class="feedback">${v.feedback.map(f=>`<div class="fb"><span class="fav" style="background:${avColor(f.who)}">${initials(f.who)}</span><div class="fbody"><div class="fwho">${esc(f.who)}<span class="fd">${fmtDate(f.date)}</span></div><div class="ftext">${esc(f.text)}</div></div></div>`).join("")}</div>`:"";
  return`<div class="track" data-vid="${v.id}"><div class="track-top"><span class="vbadge ${v.approved?"final":""}">${esc(v.v)}</span><div class="vmeta"><div class="vname">${esc(v.name)}</div><div class="vdate">Shared ${fmtDate(v.date)}</div></div></div>${player}<div class="track-foot"><span class="sent-state" style="color:${v.approved?"var(--st-approved)":"var(--ink-dim)"}">${v.approved?"You approved this":"Leave your notes below"}</span></div>${fb}${!v.approved?`<form data-action="client-note" style="padding:11px 13px;border-top:1px solid var(--line-soft);display:flex;gap:8px;align-items:flex-end"><input type="hidden" name="vid" value="${v.id}"><div class="field" style="flex:1"><label>Your notes</label><input class="inp" name="text" placeholder="e.g. Love it! Vocals up a touch in the chorus"></div><button class="btn primary" type="submit">${IC.send}Send</button></form>`:""}</div>`;
}
function submitClientNote(vid,text){const p=projById(state.clientId);const v=p.versions.find(x=>x.id===vid);if(!v)return;const note=(text||"").trim();if(!note){toast("Type a note first");return;}v.feedback.push({who:CLIENT_NAME,date:todayISO(),text:note});p.status="revisions";renderClientProject();toast("Notes sent to The Recording Club","gold");}
function clientSend(kind){const p=state.clientId?projById(state.clientId):null;const ext=kind==="Footage"?"mp4":(kind==="Stems"?"zip":(kind==="Mix"?"wav":"mp3"));const name=`${(p?p.title:CLIENT_NAME).replace(/\s+/g,"_")}_${kind.toLowerCase()}.${ext}`;if(p){p.intake.push({id:uid("f"),name,from:"client",kind,date:todayISO()});renderClientProject();}toast(`${kind} sent to The Recording Club`,"blue");}

/* ============ MODALS ============ */
function openModal(html){$("#modal").innerHTML=html;$("#scrim").classList.add("open");}
function closeModal(){$("#scrim").classList.remove("open");}
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeModal();});
function openLegend(medium){const M=MEDIA[medium];openModal(`<div class="modal-h"><h3>How the pipeline works</h3><button class="x" data-action="close-modal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div class="modal-b"><div class="legend-row" style="margin-bottom:14px">${M.steps.map(([k,l])=>`<span class="lg"><span class="d" style="background:${STATUS[k].color}"></span>${l}</span>`).join('<span class="sep">→</span>')}</div><div style="font-size:13.5px;color:var(--ink-dim);line-height:1.6">A project moves left to right, from queued through ${medium==="audio"?"mixing":"editing"}, out to the client for review, into revisions when they leave notes, and approved when signed off. Gold everywhere is logged hours.</div></div>`);}
function openSend(vid){
  const p=projById(state.selectedId),v=p.versions.find(x=>x.id===vid);if(!v)return;
  openModal(`<div class="modal-h"><h3>Send to ${esc(p.client)}</h3><button class="x" data-action="close-modal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-b"><div class="mp-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>This is what ${esc(p.client.split(" ")[0])} receives by email + private link. They review and leave notes, which land back here.</div>
      <div class="mp-card"><div class="mp-brand"><div class="mp-logo">TRC</div><div><div class="b1">The Recording Club</div><div class="b2">A new ${MEDIA[p.medium].fileNoun} is ready for you</div></div></div>
        <div class="mp-body"><h4>${esc(p.title)}</h4><div class="mpmeta">${esc(v.v)} · ${esc(v.name)} · from ${PEOPLE[p.person].name}</div>${mediaPlayer({...v,id:v.id+"-send"},p.medium)}
          <form data-action="submit-note" style="margin-top:6px"><input type="hidden" name="vid" value="${v.id}"><div class="field" style="margin-bottom:10px"><label>Notes back (simulate the client)</label><textarea class="inp" name="text" placeholder="e.g. Vocals up a touch in the chorus"></textarea></div><div style="display:flex;gap:9px;justify-content:flex-end"><button class="btn ghost" type="button" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">${IC.send}Send &amp; simulate reply</button></div></form>
        </div></div></div>`);
  bindMedia();
}
function submitNote(vid,text){const p=projById(state.selectedId),v=p.versions.find(x=>x.id===vid);if(!v)return;v.sent=true;const note=(text||"").trim();if(note){v.feedback.push({who:p.client,date:todayISO(),text:note});p.status="revisions";}else p.status="review";closeModal();renderProject(p.medium);toast(note?`Notes received from ${p.client.split(" ")[0]} → Revisions`:`Sent to ${p.client.split(" ")[0]} · awaiting notes`,note?"gold":"blue");}
function openNewProject(medium){openModal(`<div class="modal-h"><h3>New ${MEDIA[medium].tool} project</h3><button class="x" data-action="close-modal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div><div class="modal-b"><form data-action="create-project" style="display:flex;flex-direction:column;gap:13px"><input type="hidden" name="medium" value="${medium}"><div class="field"><label>Title</label><input class="inp" name="title" placeholder="${medium==="audio"?"e.g. Sunset Drive":"e.g. Tour Recap"}" required></div><div style="display:flex;gap:11px"><div class="field" style="flex:1"><label>Type</label><select class="inp" name="kind">${(medium==="audio"?["Single","EP","Album","Song"]:["Music video","Session film","Documentary","Reel"]).map(k=>`<option>${k}</option>`).join("")}</select></div><div class="field" style="flex:1"><label>Client</label><input class="inp" name="client" placeholder="e.g. Alex Kim" required></div></div><div class="field"><label>${medium==="audio"?"Mix engineer":"Editor"}</label><select class="inp" name="person">${Object.entries(PEOPLE).filter(([k,v])=>medium==="audio"?v.role==="Mix engineer":v.role==="Editor").map(([k,v])=>`<option value="${k}">${v.name}</option>`).join("")}</select></div><div style="display:flex;gap:9px;justify-content:flex-end;margin-top:4px"><button class="btn ghost" type="button" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">Create project</button></div></form></div>`);}
function createProject(fd){const medium=fd.get("medium");const id=uid("p");projects.unshift({id,medium,kind:fd.get("kind"),title:(fd.get("title")||"").trim(),client:(fd.get("client")||"").trim(),person:fd.get("person"),status:"queued",started:todayISO(),folder:"",intake:[],time:[],versions:[]});state.selectedId=id;closeModal();render();window.scrollTo(0,0);toast("Project created","blue");}

/* ============ TOASTS ============ */
function toast(msg,kind){const el=document.createElement("div");el.className="toast "+(kind||"");el.innerHTML=`<span class="td"></span>${esc(msg)}`;$("#toasts").appendChild(el);setTimeout(()=>{el.style.transition=".3s";el.style.opacity="0";el.style.transform="translateY(10px)";setTimeout(()=>el.remove(),320);},2600);}

render();
</script>
